name: CodeQL

# Scan the Python code with CodeQL and upload the alerts to the Security tab.
# The shared workflow in misthelper-devtools runs the analysis.

on:
  # No branch filter here, so a pull request against any base gets a scan.
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run every Monday at 06:00 UTC, so new CodeQL queries examine main.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# WHY this key: a new commit cancels the previous pull request run, but a main
# run is never cancelled, because each main commit needs its own analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The job below states the permissions that it needs. The empty map here
# removes every other permission.
permissions: {}

jobs:
  # The shared workflow runs the analysis in its job named analyze. Code
  # scanning keys the alerts on this file path and that job ID. Do not rename
  # this file.
  codeql:
    permissions:
      # The analysis reads the run and the code, and it uploads the alerts.
      actions: read
      contents: read
      security-events: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-codeql.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml
