name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@e8e093d205428b5503887267b6a9751fa7354be7 # v0.6.3
    with:
      python-version: '3.13'
      cache-dependency-path: requirements*.txt
      # Keep the Radon pin here until development requirements include it.
      install: python -m pip install -r requirements-dev.txt radon==6.0.1
      ruff: true
      black: true
      mypy: true
      pytest: true
      bandit: true
      pip-audit: true
      vulture: true
      radon: true
      radon-args: .
      radon-max: 15

  quality_gate_issues:
    name: "Sync quality-gate issues"
    needs: gates
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-quality-gate-issues.yml@e8e093d205428b5503887267b6a9751fa7354be7 # v0.6.3
    with:
      results: ${{ needs.gates.outputs.results }}
