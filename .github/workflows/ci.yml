name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      python-version: '3.13'
      cache-dependency-path: requirements*.txt
      ruff: true
      black: true
      mypy: true
      pytest: true
      bandit: true
      pip-audit: true
      vulture: true

  quality_gate_issues:
    name: "Sync quality-gate issues"
    needs: gates
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-quality-gate-issues.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      results: ${{ needs.gates.outputs.results }}
