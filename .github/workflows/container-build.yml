name: Build and Push Container

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'mist_connection.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'templates/**'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (leave empty for auto YY.MM.DD.HH.MM)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # First job: Validate Python syntax before building
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: |
          echo "Checking Python syntax..."
          python -m py_compile app.py
          python -m py_compile mist_connection.py
          echo "Syntax check passed"

      - name: Run basic import test
        run: |
          echo "Testing basic imports..."
          python -c "import ast; ast.parse(open('app.py').read())"
          python -c "import ast; ast.parse(open('mist_connection.py').read())"
          echo "AST parse passed"

  # Second job: Build and push container (only if validation passes). The
  # shared workflow in misthelper-devtools builds the image with Buildx, pushes
  # it to ghcr.io/<owner>/<repo>, and tags it with the version and latest. The
  # version is YY.MM.DD.HH.MM in UTC unless version_override is set.
  build-and-push:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@ca3659400847c35f5dac438c37fc5055c020910e # v0.2.0
    with:
      file: ./Dockerfile
      tags: |
        type=raw,value=latest
      version-tag: true
      version: ${{ github.event.inputs.version_override }}
