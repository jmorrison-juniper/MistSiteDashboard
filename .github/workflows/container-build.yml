name: Build and Push Container

# One workflow builds the image. The paths list names each file that the
# Dockerfile copies, plus the build files, so a change to the documentation
# builds nothing.
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'mist_connection.py'
      - 'perf_monitor.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'templates/**'
      - 'zscaler-root-ca.crt'
      - '.github/workflows/container-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'mist_connection.py'
      - 'perf_monitor.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'templates/**'
      - 'zscaler-root-ca.crt'
      - '.github/workflows/container-build.yml'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (leave empty for auto YY.MM.DD.HH.MM)'
        required: false
        default: ''

permissions: {}

jobs:
  # First job: Validate Python syntax before building
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate Python syntax
        run: |
          echo "Checking Python syntax..."
          python -m py_compile app.py
          python -m py_compile mist_connection.py
          python -m py_compile perf_monitor.py
          echo "Syntax check passed"

      - name: Run basic import test
        run: |
          echo "Testing basic imports..."
          python -c "import ast; ast.parse(open('app.py').read())"
          python -c "import ast; ast.parse(open('mist_connection.py').read())"
          python -c "import ast; ast.parse(open('perf_monitor.py').read())"
          echo "AST parse passed"

  # Second job: Build the container, and push it except for a pull request.
  # The shared workflow in misthelper-devtools builds the multi-arch image with
  # Buildx and pushes it to ghcr.io/<owner>/<repo>. A push to main gets the
  # branch, short SHA, latest, and YY.MM.DD.HH.MM (UTC) tags. A manual start
  # can set the version with version_override.
  build-and-push:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      file: ./Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha,prefix=
        type=raw,value=latest,enable={{is_default_branch}}
      version-tag: true
      version: ${{ github.event.inputs.version_override }}